<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RICOH Web Scanner Pro</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>
</head>

<body>
    <header>
        <h1>RICOH Web Scanner Pro</h1>
    </header>

    <div class="toolbar">
        <input id="playerName" type="text" class="input" placeholder="Naam speler (optioneel)" autocomplete="off" />

        <button id="startScan">Start scannen</button>
        <button id="resetBtn" class="secondary">Reset</button>
        <button id="flashToggle" class="secondary">Zaklamp: uit</button>

        <button id="downloadBtn">Download CSV</button>
        <button id="downloadExcelBtn">Download Excel</button>

        <div class="cloud-group">
            <button id="uploadOneDrive" class="cloud">Upload → OneDrive</button>
            <button id="uploadGDrive" class="cloud">Upload → Google Drive</button>
        </div>
    </div>

    <div class="video-wrap">
        <video id="camera" autoplay playsinline></video>
        <canvas id="overlay"></canvas>

        <div id="toast" class="toast">Gescand</div>
        <div id="statusLight" class="status red"></div>
    </div>

    <div class="results-section">
        <div class="results-header">
            <h2>Scanresultaten</h2>
            <span class="scan-count"><span id="scanCount">0</span> gescand</span>
        </div>

        <table id="results">
            <thead>
                <tr>
                    <th>Tijd</th>
                    <th>Speler</th>
                    <th>MAC-adres</th>
                    <th>Serienummer</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Offline-gecachede libraries -->
    <script src="libs/quagga.min.js"></script>
    <script src="libs/xlsx.full.min.js"></script>
    <script src="libs/msal-browser.min.js"></script>
    <script src="libs/google-api.js"></script>

    <script src="scanner.js"></script>
</body>

</html>
