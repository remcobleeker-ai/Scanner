<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#CE0000" />
  <title>RICOH Web Scanner Pro</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</head>
<body>
  <header>
    <h1>RICOH Web Scanner Pro</h1>
  </header>

  <div class="toolbar">
    <input id="playerName" type="text" class="input" placeholder="Naam speler (optioneel)" autocomplete="off" />

    <button id="startScan">Start scannen</button>
    <button id="resetBtn" class="secondary">Reset</button>
    <button id="flashToggle" class="secondary">Zaklamp: uit</button>

    <button id="downloadBtn">Download CSV</button>
    <button id="downloadExcelBtn">Download Excel</button>
    <button id="sendOutlookBtn" class="cloud">Verzend met Outlook</button>
  </div>

  <div class="video-wrap">
    <video id="camera" autoplay playsinline></video>
    <canvas id="overlay"></canvas>

    <div id="toast" class="toast">Gescand</div>
    <div id="statusLight" class="status red"></div>
  </div>

  <div class="results-section">
    <div class="results-header">
      <h2>Scanresultaten</h2>
      <span class="scan-count"><span id="scanCount">0</span> gescand</span>
    </div>

    <table id="results">
      <thead>
      <tr>
        <th>Tijd</th>
        <th>Speler</th>
        <th>LAN‑MAC</th>
        <th>Wi‑Fi‑MAC</th>
        <th>Serienummer</th>
      </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- LIBS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@0.12.1/dist/quagga.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- App logic -->
  <script src="scanner.js"></script>
</body>
</html>
